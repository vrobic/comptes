services:
  php:
    image: ${IMAGES_PREFIX:-}app-php
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
      # The two next lines can be removed after initial installation
      SYMFONY_VERSION: ${SYMFONY_VERSION:-}
      STABILITY: ${STABILITY:-stable}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # Ports publiés sur la seule boucle locale : sinon, Docker les ouvre à tout le réseau, en contournant le pare-feu
    ports:
      # HTTP
      - target: 80
        host_ip: 127.0.0.1
        published: ${HTTP_PORT:-80}
        protocol: tcp
      # HTTPS
      - target: 443
        host_ip: 127.0.0.1
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      # HTTP/3
      - target: 443
        host_ip: 127.0.0.1
        published: ${HTTP3_PORT:-443}
        protocol: udp

  database:
    image: mysql:${MYSQL_VERSION}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      # You should definitely change the password in production
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
    healthcheck:
      # 127.0.0.1 force TCP : le serveur temporaire qui initialise une base neuve n'écoute que sur la socket
      test: ["CMD", "mysqladmin" ,"ping", "-h", "127.0.0.1"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      # Volume propre à MySQL 8.4 : l'ancien volume database_data, créé par MySQL 5.7, est incompatible et n'est plus monté
      - database_data_mysql84:/var/lib/mysql:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/mysql:rw
    ports:
      - "127.0.0.1:3306:3306"

volumes:
  caddy_data:
  caddy_config:
  database_data_mysql84:
