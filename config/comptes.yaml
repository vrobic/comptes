import:
    # Configuration des handlers d'import de mouvements.
    # Chaque handler doit définir au moins les paramètres "name", "description"
    # et "extension", les autres sont libres et propres à chaque implémentation.
    handlers:
        mouvements:
            # Identifiant du service d'import, ici "comptes.import.mouvements.cm.excel".
            cm.excel:
                # Nom de la source
                name: Crédit Mutuel - Excel
                # Description de la source. HTML autorisé.
                description: |-
                    Import multicompte : chaque feuille est importée sur le compte dont elle porte le numéro.
                # L'extension du fichier attendu par le handler d'import
                extension: xlsx
            # Identifiant du service d'import, ici "comptes.import.mouvements.cm.csv".
            cm.csv:
                # Nom de la source
                name: Crédit Mutuel - CSV
                # Description de la source. HTML autorisé.
                description: |-
                    Import monocompte, montants sur deux colonnes, dates au format JJ/MM/AAAA, séparateur : point-virgule, séparateur décimales : virgule.
                    Destination : compte courant.
                # L'extension du fichier attendu par le handler d'import
                extension: csv
                # Autres paramètres propres à ce handler
                config:
                    # Le fichier CSV ne contient les mouvements que d'un seul compte.
                    # Ce paramètre indique l'identifiant du compte sur lequel les importer.
                    compte: e25b85a2-8bbc-460f-bcd9-00c8cdabb49b
            # Identifiant du service d'import, ici "comptes.import.mouvements.cic.excel".
            cic.excel:
                # Nom de la source
                name: CIC - Excel
                # Description de la source. HTML autorisé.
                description: |-
                    Import multicompte : chaque feuille est importée sur le compte dont elle porte le numéro.
                # L'extension du fichier attendu par le handler d'import
                extension: xlsx
            # Identifiant du service d'import, ici "comptes.import.mouvements.cic.csv".
            cic.csv:
                # Nom de la source
                name: CIC - CSV
                # Description de la source. HTML autorisé.
                description: |-
                    Import monocompte, montants sur deux colonnes, dates au format JJ/MM/AAAA, séparateur : point-virgule, séparateur décimales : virgule.
                    Destination : compte courant.
                # L'extension du fichier attendu par le handler d'import
                extension: csv
                # Autres paramètres propres à ce handler
                config:
                    # Le fichier CSV ne contient les mouvements que d'un seul compte.
                    # Ce paramètre indique l'identifiant du compte sur lequel les importer.
                    compte: e25b85a2-8bbc-460f-bcd9-00c8cdabb49b
            # Identifiant du service d'import, ici "comptes.import.mouvements.caissedepargne.csv".
            caissedepargne.csv:
                # Nom de la source
                name: Caisse d'Épargne - CSV
                # Description de la source. HTML autorisé.
                description: |-
                    Import monocompte.
                    Destination : compte courant.
                # L'extension du fichier attendu par le handler d'import
                extension: csv
                # Autres paramètres propres à ce handler
                config:
                    # Le fichier CSV ne contient les mouvements que d'un seul compte.
                    # Ce paramètre indique l'identifiant du compte sur lequel les importer.
                    compte: e25b85a2-8bbc-460f-bcd9-00c8cdabb49b
