# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Un fichier d'import qui ne respecte pas le format du handler est une erreur de l'utilisateur, et non du serveur
    exceptions:
        App\Application\Import\FichierImportInvalideException:
            status_code: 400

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
